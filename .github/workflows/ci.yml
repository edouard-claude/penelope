name: CI

# La définition de « terminé » du PRD (§20.2) : suites sans réseau vertes,
# `cargo clippy -- -D warnings` et `cargo deny check` propres. La CI ne fait rien
# d'autre que rejouer exactement ces commandes.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  # La suite entière tourne sur Linux : dix fois moins cher que macOS, et chacun peut la
  # rejouer. Sans bac à sable sur cette plateforme, les tests de logique y tournent sans
  # profil imposé (issue #102).
  tests:
    name: Tests (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      # `rust-toolchain.toml` épingle la version : rustup l'installe tout seul.
      - name: Chaîne d'outils
        run: |
          rustup toolchain install
          rustc --version && cargo --version

      # Registre seulement : `target/` dépassait 7 Gio compressé et sa restauration saturait
      # le disque du runner.
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-registry-

      # 1531 tests, tous hors réseau. Les suites nommées du §20.1 sont des filtres sur
      # cette commande : `arch`, `ctx-safety`, `mcp-conformance`, `hot-reload`,
      # `resilience` et `security` en font partie.
      - name: Tests
        run: cargo test --workspace --no-fail-fast

  # macOS est la plateforme cible : format, lint, et ce qui n'existe que là (Seatbelt,
  # launchd, trousseau, binaire de release). Pas la suite entière une seconde fois.
  verification:
    name: Format, lint et plateforme (macOS)
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Chaîne d'outils
        run: |
          rustup toolchain install
          rustc --version && cargo --version

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-registry-

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # Backends macOS : Seatbelt réellement appliqué (lectures refusées, sockets Unix
      # fermées), répertoires, trousseau par `security` en lecture seule.
      - name: Plateforme
        run: |
          cargo test -p penelope-platform
          cargo test -p penelope-platform --lib seatbelt -- --ignored

      # Un vrai serveur MCP stdio sous le profil `mcp-stdio`, et le réseau du shell
      # accordé par appel (#106).
      - name: Daemon sous bac à sable
        run: >-
          cargo test -p penelope-daemon --lib --
          a_real_stdio_server_runs_under_the_sandbox
          shell_network_is_granted_per_call_under_the_sandbox

      # Relais de mise à jour contre le vrai launchd (issue #36) : un faux daemon sous
      # LaunchAgent charge le relais depuis son propre job, le service doit repartir sans
      # intervention, ou revenir à l'ancien binaire si le nouveau ne démarre pas.
      - name: launchd
        env:
          PENELOPE_LAUNCHD_TESTS: "1"
        run: cargo test -p penelope-platform --test launchd_relay

      - name: Binaire de release
        run: cargo build --release --locked -p penelope-cli

  dependances:
    name: cargo deny
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Cache cargo-deny
        id: cache-deny
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-deny
          key: cargo-deny-${{ runner.os }}-v1

      - name: Installer cargo-deny
        if: steps.cache-deny.outputs.cache-hit != 'true'
        run: cargo install cargo-deny --locked

      # Avis de sécurité, licences autorisées, dépendances interdites, provenance.
      - name: Vérifier
        run: cargo deny check
