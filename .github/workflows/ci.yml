name: CI

# La définition de « terminé » du PRD (§20.2) : suites sans réseau vertes,
# `cargo clippy -- -D warnings` et `cargo deny check` propres. La CI ne fait rien
# d'autre que rejouer exactement ces commandes.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  # La suite entière tourne sur Linux : dix fois moins cher que macOS, et chacun peut la
  # rejouer. Sans bac à sable sur cette plateforme, les tests de logique y tournent sans
  # profil imposé (issue #102).
  tests:
    name: Tests (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      # `rust-toolchain.toml` épingle la version : rustup l'installe tout seul.
      - name: Chaîne d'outils
        run: |
          rustup toolchain install
          rustc --version && cargo --version

      # Registre seulement : `target/` dépassait 7 Gio compressé et sa restauration saturait
      # le disque du runner.
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-registry-

      # Tests sans réseau externe. Les suites nommées du §20.1 sont des filtres sur
      # cette commande : `arch`, `ctx-safety`, `mcp-conformance`, `hot-reload`,
      # `resilience` et `security` en font partie.
      - name: Tests
        run: cargo test --workspace --no-fail-fast

  # macOS est la plateforme cible : format, lint, et ce qui n'existe que là (Seatbelt,
  # launchd, trousseau, binaire de release). Pas la suite entière une seconde fois.
  verification:
    name: Format, lint et plateforme (macOS)
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Chaîne d'outils
        run: |
          rustup toolchain install
          rustc --version && cargo --version

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-registry-

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # Backends macOS : Seatbelt réellement appliqué (lectures refusées, sockets Unix
      # fermées), répertoires, trousseau par `security` en lecture seule.
      - name: Plateforme
        run: |
          cargo test -p penelope-platform
          cargo test -p penelope-platform --lib seatbelt -- --ignored

      # La même suite que la vérification de release (#151) : `main` ne doit pas être
      # verte sur une suite que la release découvre rouge. Les tests réservés à macOS
      # (serveur MCP stdio sous `mcp-stdio`, réseau du shell accordé par appel, #106,
      # #89, #122) tournent ici dans le même processus que les autres, ce qui est
      # précisément la condition où un état global les fait se polluer.
      - name: Tests
        run: cargo test --workspace

      # Relais de mise à jour contre le vrai launchd (issue #36) : un faux daemon sous
      # LaunchAgent charge le relais depuis son propre job, le service doit repartir sans
      # intervention, ou revenir à l'ancien binaire si le nouveau ne démarre pas.
      - name: launchd
        env:
          PENELOPE_LAUNCHD_TESTS: "1"
        run: cargo test -p penelope-platform --test launchd_relay

      - name: Binaire de release
        run: cargo build --release --locked -p penelope-cli

  dependances:
    name: cargo deny
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Cache cargo-deny
        id: cache-deny
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-deny
          key: cargo-deny-${{ runner.os }}-v1

      - name: Installer cargo-deny
        if: steps.cache-deny.outputs.cache-hit != 'true'
        run: cargo install cargo-deny --locked

      # Avis de sécurité, licences autorisées, dépendances interdites, provenance.
      - name: Vérifier
        run: cargo deny check

  # Le tag et la release se posent tout seuls (issue #147). Trois lots fusionnés le 20/09
  # sont restés une heure sans release parce que personne n'avait taggé, puis deux sessions
  # ont livré en parallèle. Ici : un seul job à la fois, après les suites, sur `main`, et
  # seulement quand la version du workspace n'a pas encore son tag.
  livraison:
    name: Tag et release
    needs: [tests, verification, dependances]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: livraison
      cancel-in-progress: false
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Version du workspace
        id: version
        run: |
          set -euo pipefail
          v=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)
          echo "tag=v${v}" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/v${v}" >/dev/null; then
            echo "v${v} existe déjà : rien à poser"
            echo "poser=false" >> "$GITHUB_OUTPUT"
          else
            echo "poser=true" >> "$GITHUB_OUTPUT"
          fi

      # Un tag posé par `GITHUB_TOKEN` ne déclenche pas `on: push: tags` : la release est
      # donc appelée explicitement juste après (`workflow_dispatch` est l'exception).
      - name: Poser le tag
        if: steps.version.outputs.poser == 'true'
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Version ${TAG#v}"
          git push origin "$TAG"

      - name: Lancer la release
        if: steps.version.outputs.poser == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          gh workflow run release.yml -f tag="$TAG" --ref main
