name: Release

# Déclenché par un tag `vX.Y.Z`. Produit un binaire universel macOS, plus les deux
# binaires par architecture, chacun avec sa somme de contrôle.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag à publier (par exemple v0.1.0)"
        required: true
        type: string

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  verification:
    name: Vérifier avant de publier
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Chaîne d'outils
        run: |
          rustup toolchain install
          rustc --version
      # Le tag et la version du workspace doivent dire la même chose, sinon
      # `penelope --version` mentirait sur l'archive téléchargée.
      - name: Le tag correspond à la version du workspace
        env:
          VERSION: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          crate=$(cargo pkgid -p penelope-cli | sed -E 's/.*[@#]([0-9][^@#]*)$/\1/')
          echo "tag : ${VERSION}  workspace : ${crate}"
          if [ "${VERSION#v}" != "$crate" ]; then
            echo "::error::le tag ${VERSION} ne correspond pas à la version ${crate} du workspace"
            exit 1
          fi
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      # On ne publie pas un binaire dont les suites ne sont pas vertes.
      - name: Tests
        run: cargo test --workspace

      # Banc d'essai de la mémoire (issue #37) : son rapport accompagne la release.
      - name: Banc d'essai de la mémoire
        env:
          PENELOPE_BENCH_REPORT: ${{ github.workspace }}/banc-memoire.md
        run: cargo test -p penelope-evals --test mem_bench
      - uses: actions/upload-artifact@v4
        with:
          name: rapport-memoire
          path: banc-memoire.md
          if-no-files-found: error

  construire:
    name: Construire (${{ matrix.target }})
    needs: verification
    runs-on: macos-14
    timeout-minutes: 45
    strategy:
      fail-fast: true
      matrix:
        target: [aarch64-apple-darwin, x86_64-apple-darwin]
    steps:
      - uses: actions/checkout@v4

      # Les deux cibles macOS sont déclarées dans `rust-toolchain.toml`.
      - name: Chaîne d'outils
        run: |
          rustup toolchain install
          rustc --version

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: release-${{ matrix.target }}-${{ hashFiles('**/Cargo.lock') }}

      # La clé publique minisign (variable du dépôt, pas un secret) est intégrée au
      # binaire : il refusera ensuite toute mise à jour dont les sommes ne sont pas signées.
      - name: Construire
        env:
          TARGET: ${{ matrix.target }}
          PENELOPE_MINISIGN_PUBKEY: ${{ vars.MINISIGN_PUBLIC_KEY }}
        run: cargo build --release --locked -p penelope-cli --target "$TARGET"

      # Seul l'hôte arm64 exécute son propre binaire sans Rosetta.
      - name: Vérifier que le binaire répond
        if: matrix.target == 'aarch64-apple-darwin'
        run: ./target/aarch64-apple-darwin/release/penelope --version

      - uses: actions/upload-artifact@v4
        with:
          name: penelope-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/penelope
          retention-days: 1
          if-no-files-found: error

  publier:
    name: Publier la release
    needs: construire
    runs-on: macos-14
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: binaires

      - name: Assembler les archives
        env:
          # Un tag ne peut venir que d'un porteur des droits d'écriture ; il passe
          # quand même par l'environnement, jamais dans la ligne de commande.
          VERSION: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          mkdir -p dist universel

          # Binaire universel : une seule archive, Intel comme Apple Silicon.
          lipo -create -output universel/penelope \
            binaires/penelope-aarch64-apple-darwin/penelope \
            binaires/penelope-x86_64-apple-darwin/penelope
          chmod +x universel/penelope
          lipo -info universel/penelope
          tar -czf "dist/penelope-${VERSION}-macos-universal.tar.gz" -C universel penelope

          for arch in aarch64 x86_64; do
            src="binaires/penelope-${arch}-apple-darwin"
            chmod +x "${src}/penelope"
            tar -czf "dist/penelope-${VERSION}-macos-${arch}.tar.gz" -C "$src" penelope
          done

          # Rapport du banc d'essai de la mémoire, hors sommes : ce n'est pas un binaire.
          cp binaires/rapport-memoire/banc-memoire.md dist/banc-memoire.md

          cd dist
          shasum -a 256 ./*.tar.gz > SHA256SUMS
          cat SHA256SUMS

      # Signature de SHA256SUMS (`penelope upgrade` la vérifie). Clé créée sans mot de
      # passe (`minisign -G -W`) : c'est le secret du dépôt qui la protège.
      - name: Signer les sommes
        env:
          VERSION: ${{ inputs.tag || github.ref_name }}
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
          MINISIGN_PUBLIC_KEY: ${{ vars.MINISIGN_PUBLIC_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${MINISIGN_SECRET_KEY}" ]; then
            if [ -n "${MINISIGN_PUBLIC_KEY}" ]; then
              echo "::error::clé publique configurée sans MINISIGN_SECRET_KEY : les binaires refuseraient cette release"
              exit 1
            fi
            echo "::warning::MINISIGN_SECRET_KEY absent : release non signée"
            exit 0
          fi
          brew install minisign
          umask 077
          key="${RUNNER_TEMP}/minisign.key"
          printf '%s\n' "${MINISIGN_SECRET_KEY}" > "$key"
          minisign -S -s "$key" -m dist/SHA256SUMS -t "penelope ${VERSION}" < /dev/null
          rm -f "$key"
          if [ -n "${MINISIGN_PUBLIC_KEY}" ]; then
            minisign -V -P "${MINISIGN_PUBLIC_KEY}" -m dist/SHA256SUMS
          fi
          cat dist/SHA256SUMS.minisig

      - name: Rédiger les notes
        env:
          VERSION: ${{ inputs.tag || github.ref_name }}
          MINISIGN_PUBLIC_KEY: ${{ vars.MINISIGN_PUBLIC_KEY }}
        run: |
          set -euo pipefail
          # Notes de version : la section « ### X.Y.Z » de docs/progress.md. Le job
          # `verification` (cargo test) garantit qu'elle existe pour la version publiée ;
          # le repli couvre une exécution isolée de ce job.
          notes_section=$(awk -v ver="### ${VERSION#v}" '
            $0 == ver { found = 1; next }
            found && (/^### / || /^## /) { exit }
            found {
              if (!started && $0 ~ /^[ \t]*$/) next
              started = 1
              print
            }
          ' docs/progress.md)
          {
            echo "Binaires macOS 13 ou plus récent, construits et testés par la CI."
            echo
            if [ -n "$notes_section" ]; then
              echo "## Nouveautés"
              echo
              printf '%s\n' "$notes_section"
              echo
            fi
            echo "L'archive \`macos-universal\` marche sur Apple Silicon comme sur Intel ;"
            echo "les archives par architecture sont là pour qui préfère un binaire plus petit."
            echo
            echo '```bash'
            echo "shasum -a 256 -c SHA256SUMS --ignore-missing"
            echo '```'
            if [ -f dist/SHA256SUMS.minisig ]; then
              echo
              echo "Les sommes sont signées (minisign) :"
              echo
              echo '```bash'
              echo "minisign -V -P ${MINISIGN_PUBLIC_KEY:-<clé publique>} -m SHA256SUMS"
              echo '```'
            fi
            echo
            echo '```bash'
            echo "tar -xzf penelope-${VERSION}-macos-universal.tar.gz"
            echo "sudo mv penelope /usr/local/bin/ && penelope doctor"
            echo '```'
            echo
            echo "Le détail complet, et ce qui manque encore : voir \`docs/progress.md\`."
          } > notes.md
          cat notes.md

      - name: Créer la release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          # Avant 1.0, ou avec un suffixe (`-rc.1`), c'est une pré-release.
          prerelease=false
          case "$VERSION" in
            v0.*|*-*) prerelease=true ;;
          esac
          if gh release view "$VERSION" >/dev/null 2>&1; then
            gh release edit "$VERSION" --title "Pénélope $VERSION" --notes-file notes.md \
              --prerelease="$prerelease"
          else
            gh release create "$VERSION" --title "Pénélope $VERSION" --notes-file notes.md \
              --prerelease="$prerelease"
          fi
          gh release upload "$VERSION" dist/* --clobber
