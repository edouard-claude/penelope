name = "outil-terminal"
description = """Un terminal que le propriétaire a ouvert avec `penelope term` et accepté de
partager (#397) : sa fiche et la copie de son écran sont semées dans `{state}/terms`, avec
des couleurs. Le propriétaire demande pourquoi son build casse ; le modèle lit le terminal
par `read_terminal` sans le désigner (il n'y en a qu'un), reçoit les dernières lignes
nettoyées et citées comme données, et répond sans rien relancer ni écrire."""
