name = "indice-perseverance-codex"
description = """Expérience persévérance (#291) : `agent.unlimited_tokens_hint` activé et l'alias
`main` sur un modèle `codex:`. Chaque requête vue par le modèle porte, hors `messages` et en
toute fin, le message de rôle `developer` « You have unlimited tokens left in this context
window. » (`developer_note` dans la surface) ; l'historique envoyé est le même qu'il serait
sans. Le monde ne le montre nulle part : ni dans les messages, ni dans le journal `conv.*` ;
seul `runtime.llm` porte `unlimited_tokens_hint: true`."""
pin_model = "main"

[config]
"agent.unlimited_tokens_hint" = true
"models.aliases.main" = "codex:gpt-6-astra"

[[steps]]
kind = "message"
text = "fais le point sur les factures en retard"

[[steps]]
kind = "message"
text = "et les devis en attente ?"
