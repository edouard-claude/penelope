name = "outils-soi"
description = """Outils sur Pénélope elle-même et sur la session : l'heure dans un autre
fuseau (`time_now`, horloge de test), la documentation embarquée (`self_docs`, recherche),
l'inventaire des outils (`self_status`, section `tools`), un réglage changé à chaud
(`config_set`, classé destructif : il attend l'accord du propriétaire, même en mode
`auto`, puis la reprise l'applique) et les critères de la session (`session_metadata`, posés puis
cochés). Le monde montre la génération de configuration et le critère passé à
`completed`."""
pin_model = "main"

[config]
"tools.approval_mode" = "auto"

[[steps]]
kind = "message"
text = "quelle heure est-il à Paris ? passe le délai du shell à 5 minutes et pose le critère : le devis ACME est envoyé (c'est fait)"

[[steps]]
kind = "approve"
