name = "trace-des-outils"
description = """Trace des outils sur Telegram (issue #222) : un tour à outils pose une seule bulle
avant la réponse, puis la modifie en place une fois la réponse partie. Deux lectures du
même fichier se groupent (×2), un lot parallèle apparie ses résultats dans l'ordre, une
lecture ratée finit en ❌, le motif de recherche qui porte un jeton est caviardé. Un tour
sans outil ne pose aucune bulle."""

[config]
"models.routing.classifier" = false

[[files]]
path = "notes.txt"
content = """- relancer le client Borealis
- vérifier la TVA du devis ACME
- préparer la migration PROJ-7
"""

[[steps]]
kind = "telegram"
text = "fais le point sur mes notes"

[[steps]]
kind = "telegram"
text = "merci"
