name = "rpc-inference-locale"
description = """Le diagnostic d'un serveur d'inférence locale (#259), par la socket comme
`penelope doctor`. Le faux serveur rend le catalogue de mlx_lm.server 0.31.3 capturé sur un
M2 (le cache Hugging Face, sans fenêtre annoncée). L'alias `main` vise un modèle servi : le
contrôle `local.local` le dit, avec la fenêtre configurée faute d'annonce et un cache de
préfixe pas encore mesuré. `main` repointé (`model.set`) vers un modèle absent du cache : le
contrôle échoue en nommant l'alias, le modèle et ce que le serveur sert.

Puis `main` repointé vers Llama 3.2, servi, dont les appels sont rendus en texte : deux
appels identiques (`time_now`) qui portent le **même identifiant**, `call_0`, celui que la
relecture donnait à chacun (#266). Le second est un autre appel : il s'exécute et rend
l'heure avancée, le ledger porte deux effets, le second sous une identité ancrée au message
qui le porte, et l'écart est journalisé (`tool.call_id_reused`)."""
pin_model = "main"

[config]
"providers.local.enabled" = true
"providers.local.base_url" = "{{http}}/v1"
"models.aliases.main" = "local:mlx-community/Qwen3-1.7B-4bit"

[[http]]
path = "/v1/models"
method = "GET"
body = """{"object": "list", "data": [{"id": "mlx-community/Qwen3-1.7B-4bit", "object": "model", "created": 1790674667}, {"id": "mlx-community/Llama-3.2-1B-Instruct-4bit", "object": "model", "created": 1790674667}]}"""

[[steps]]
kind = "rpc"
method = "doctor"
only = { id = ["local.*"] }

[[steps]]
kind = "rpc"
method = "model.set"
params = { alias = "main", model = "local:mlx-community/Qwen3-8B-4bit" }

[[steps]]
kind = "rpc"
method = "doctor"
only = { id = ["local.*"] }

[[steps]]
kind = "rpc"
method = "model.set"
params = { alias = "main", model = "local:mlx-community/Llama-3.2-1B-Instruct-4bit" }

[[steps]]
kind = "message"
text = "quelle heure est-il ?"

[[steps]]
kind = "advance_clock"
by = "10m"

[[steps]]
kind = "message"
text = "et maintenant ?"
