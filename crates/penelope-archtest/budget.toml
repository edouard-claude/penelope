# Frontière canal / cœur (R8 du découpage, #214) : mentions du canal (`telegram` en toute
# casse, `tg_…`, `chat_id`, `topic_id`, `callback_data`, `find_by_topic`) dans les lignes
# de code des crates agnostiques, hors telegram.rs et telegram/. Un fichier absent a un
# budget de 0. Le cœur ne connaît un canal que par ChannelDelivery, Messenger ou
# OwnerChannel ; ces entrées ne peuvent que décroître (lot D, T36), sauf les permanentes,
# justifiées en commentaire, qui attendent T37 après la V1.
[channel.allowed]
"crates/penelope-tools/src/spec/agent.rs" = 4   # suit spec.rs (découpage T32)
"crates/penelope-store/src/migrations/init.rs" = 22   # suit migrations.rs (découpage T32) : l'historique SQL est immuable
"crates/penelope-kernel/src/config/validate.rs" = 11   # suit config.rs (découpage T32)
"crates/penelope-kernel/src/config/store.rs" = 1   # suit config.rs (découpage T32)
"crates/penelope-kernel/src/config/channel.rs" = 11   # suit config.rs (découpage T32) : la section [telegram]
"crates/penelope-vault/src/session_project.rs" = 2   # descendu du daemon avec le vault (T22) : le sujet Telegram nomme le projet
"crates/penelope-daemon/src/rpc/methods/workflows.rs" = 7   # découpage (lot G) : la mention suit son code
"crates/penelope-daemon/src/rpc/methods/approvals.rs" = 9   # découpage (lot G) : la mention suit son code
"crates/penelope-mcp-host/src/lifecycle.rs" = 1   # découpage (lot G), puis sortie du daemon (T25) : la mention suit son code
"crates/penelope-ops/src/doctor/secrets.rs" = 12   # découpage (lot G), puis sortie du daemon (T28) : la mention suit son code
"crates/penelope-ops/src/doctor/mod.rs" = 15   # découpage (lot G), puis sortie du daemon (T28) : la mention suit son code
"crates/penelope-ops/src/doctor/machine.rs" = 3   # découpage (lot G), puis sortie du daemon (T28) : la mention suit son code
"crates/penelope-ops/src/doctor/coherence.rs" = 12   # découpage (lot G), puis sortie du daemon (T28) : la mention suit son code
"crates/penelope-agent/src/pipeline.rs" = 1   # EffectKind::Telegram (effect_kind) : suit le fichier dans penelope-agent (T10) ; disparaît avec T37
"crates/penelope-daemon/src/tool_jobs.rs" = 6   # fusion de main 0.17.61 : #204 (jobs d'outils) ajouté avant le gel
"crates/penelope-kernel/src/session.rs" = 37
"crates/penelope-store/src/migrations.rs" = 8   # permanent : l'historique SQL est immuable (tables tg_updates, tg_outbox)
"crates/penelope-kernel/src/config.rs" = 2      # permanent : le schéma de configuration nomme ses canaux ([telegram])
"crates/penelope-daemon/src/supervisor.rs" = 13
"crates/penelope-ops/src/purge.rs" = 16   # purge.rs sorti du daemon (T28) : la mention suit son code
"crates/penelope-daemon/src/runtime.rs" = 4
"crates/penelope-app/src/services.rs" = 2   # réglage de test `telegram.text_group_window_ms` et nom du sous-système `telegram` (T36 a sorti gabarits et actions)
"crates/penelope-executor/src/selfknow.rs" = 9   # résumé de la section `[telegram]` de la configuration et chemins protégés (`owner.telegram_user_id`, `telegram.`) ; les commandes viennent du canal (T36)
"crates/penelope-daemon/src/engine.rs" = 9
"crates/penelope-app/src/bus.rs" = 3          # permanent pour Origin::Telegram, tant qu'Origin::Channel n'existe pas (T37)
"crates/penelope-kernel/src/turn.rs" = 6
"crates/penelope-kernel/src/effects.rs" = 5
"crates/penelope-app/src/helpers.rs" = 9   # clés kv et origine du canal sorties de telegram.rs et scheduler.rs (épopée #208, lot D, T06)
"crates/penelope-observe/src/redact.rs" = 2      # permanent : le caviardage doit connaître la forme des jetons
"crates/penelope-mcp-host/src/auth.rs" = 1   # mcp_auth.rs sorti du daemon (T25) : la mention suit son code
"crates/penelope-app/src/media.rs" = 1
"crates/penelope-ops/src/session_ops.rs" = 1   # session_ops.rs sorti du daemon (T28) : la mention suit son code
"crates/penelope-ops/src/upgrade.rs" = 1   # upgrade.rs sorti du daemon (T28) : la mention suit son code
"crates/penelope-executor/src/voice.rs" = 1   # voice.rs sorti du daemon (T24) : la mention suit son code
