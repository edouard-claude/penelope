# Surfaces visibles sans scénario rejouable (R10, épopée #208) : commandes Telegram
# (`/nom`), outils natifs (`outil:nom`) et méthodes RPC (`rpc:nom`) qu'aucun scénario de
# crates/penelope-evals/scenarios/ n'exerce, calculées par archtest (scenarios.rs) : une
# étape `command` du scenario.toml, un appel d'outil du model.jsonl. Posée à 213 sur
# 219 surfaces (6 couvertes). Elle ne peut que rétrécir ; une surface nouvelle sans
# scénario fait échouer `every_visible_surface_has_a_scenario`. Vide à la bascule (§4.5).
