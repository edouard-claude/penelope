# crates/penelope-archtest/budget.toml : gel de la dette (#209, #210, #211, #213, #214).
#
# Les nombres ne montent jamais. `UPDATE_BUDGET=1 cargo test -p penelope-archtest` les
# abaisse à la valeur courante et retire les entrées passées sous leur plafond ; les
# remonter, ou ajouter une entrée à une liste de référence, demande le trailer
# « Dérogation-budget: #N » dans un commit de la plage (scripts/check-budget.sh).
# Relevé au commit qui pose le gel, sur la branche v1 (design/v1/gel-et-outillage.md §3).

[files]
ceiling = 1000        # src/**/*.rs, tests inline compris (R1)
test_ceiling = 1500   # tests/**/*.rs, src/**/tests.rs, *_tests.rs, modules cfg(test) (R2)
test_modules = [
    "crates/penelope-daemon/src/wiki_e2e.rs",
]

# Liste de référence (R3) : les fichiers autorisés à dépasser, chacun avec sa borne.
# Elle ne peut que rétrécir : un fichier repassé sous le plafond doit en sortir.
[files.oversized]
"crates/penelope-daemon/src/tool_jobs.rs" = 1207   # fusion de main 0.17.61 : #204 (jobs d'outils) ajouté avant le gel
"crates/penelope-daemon/src/engine.rs" = 1105
"crates/penelope-kernel/src/config.rs" = 2148   # fusion de main 0.17.61 : #204 (jobs d'outils) ajouté avant le gel
"crates/penelope-cli/src/commands.rs" = 2179   # fusion de main 0.17.61 : #204 (jobs d'outils) ajouté avant le gel
"crates/penelope-daemon/src/compaction.rs" = 1208
"crates/penelope-llm/src/provider.rs" = 2048
"crates/penelope-daemon/src/scheduler.rs" = 1095
"crates/penelope-memory/src/index.rs" = 1622
"crates/penelope-llm/src/codex.rs" = 1533
"crates/penelope-memory/src/consolidation.rs" = 1476
"crates/penelope-tools/src/spec.rs" = 1377   # fusion de main 0.17.61 : #204 (jobs d'outils) ajouté avant le gel
"crates/penelope-mcp/src/transport.rs" = 1265
"crates/penelope-context/src/engine.rs" = 1025
"crates/penelope-mcp/src/registry.rs" = 1200
"crates/penelope-memory/src/vault.rs" = 1163
"crates/penelope-kernel/src/turn.rs" = 1136
"crates/penelope-context/src/compaction.rs" = 1122
"crates/penelope-hitl/src/policy.rs" = 1120
"crates/penelope-workflow/src/validate.rs" = 1101
"crates/penelope-platform/src/backend/macos.rs" = 1082
"crates/penelope-memory/src/recall.rs" = 1066
"crates/penelope-store/src/lib.rs" = 1036
"crates/penelope-mcp/src/client.rs" = 1027
"crates/penelope-platform/src/process.rs" = 1008
"crates/penelope-workflow/src/schedules.rs" = 1003

# Plafond de lignes de src/ par crate (R4) : 78 668 au gel, plus 2 500 de marge, soit une
# vingtaine de correctifs de taille courante. Un autre crate se plafonne en ajoutant une
# ligne. UPDATE_BUDGET ne touche pas à cette table.
[crates]
"penelope-daemon" = 25800   # v1 : après la sortie de app, mcp-host, vault, ops, passerelle, agent, dream et executor ; redescend avec conversation, orchestrator

# Liste blanche des modules du daemon (R5) : les déclarations `mod x;` de lib.rs et
# `mod screens;` de telegram.rs. `mod tests;` est toujours permis. Les fichiers où un bloc
# `impl Daemon` est admis (R6) : les quatre existants, pas un de plus.
[daemon]
modules = [
    "agent",
    "approval_mode",
    "audit",
    "budget_alert",
    "cache_audit",
    "compaction",
    "conversation",
    "dream",
    "engine",
    "executor",
    "history",  # étape de boot du scellement (épopée #208, lot E, T11), prévue par source-de-verite.md
    "ingest",
    "prompt_snapshot",
    "purge",
    "rpc",
    "runner",
    "runtime",
    "runtime_events",
    "scheduler",
    "selfknow",
    "session_ops",
    "supervisor",
    "titles",
    "wiki_e2e",
    "workflow",  # aides de test sorties de mcp.rs (#215),
  "tool_jobs",  # sous-module de agent/ (lot F, T02 à T06)
]
impl_daemon = ["runtime.rs", "engine.rs", "runner.rs", "supervisor.rs"]

# Occurrences du type `Daemon` par fichier du daemon (R6), hors commentaires et avant le
# module de tests, frontière de mot (DaemonHandle et DaemonTokens ne comptent pas). Un
# fichier absent a un budget de 0. Cible V1 : seuls runtime, engine, runner, supervisor
# et rpc le nomment encore.
[daemon.daemon_users]
"rpc/server.rs" = 2   # découpage (lot G) : la mention suit son code
"rpc/mod.rs" = 4   # découpage (lot G) : la mention suit son code
"rpc/methods/workflows.rs" = 1   # découpage (lot G) : la mention suit son code
"rpc/methods/memory.rs" = 1   # découpage (lot G) : la mention suit son code
"workflow/step_ctx.rs" = 1   # découpage (lot G) : la mention suit son code
"workflow/step_agent.rs" = 1   # découpage (lot G) : la mention suit son code
"workflow/start.rs" = 3   # découpage (lot G) : la mention suit son code
"workflow/orchestrator.rs" = 2   # découpage (lot G) : la mention suit son code
"workflow/mod.rs" = 2   # découpage (lot G) : la mention suit son code
"workflow/driver.rs" = 8   # découpage (lot G) : la mention suit son code
"workflow/control.rs" = 3   # découpage (lot G) : la mention suit son code
"tool_jobs.rs" = 3   # fusion de main 0.17.61 : #204 (jobs d'outils) ajouté avant le gel
"scheduler.rs" = 25
"compaction.rs" = 17
"dream/mod.rs" = 3
"supervisor.rs" = 10
"runner.rs" = 8
"runtime.rs" = 6
"engine.rs" = 3
"runtime_events.rs" = 2
"cache_audit.rs" = 1
"lib.rs" = 1          # le réexport `pub use runtime::{Daemon, …}`

# `#[allow(clippy::too_many_lines)]` dans les sources (R7, #211) : les allows de la pose
# du lint sont comptés par le lot qui les pose ; d'ici là, aucun.
[lints]
allow_too_many_lines = 22

# Les critères d'acceptation (R8, #213) : chaque nom doit exister comme fonction quelque
