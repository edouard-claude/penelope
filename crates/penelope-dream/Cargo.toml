[package]
name = "penelope-dream"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

# La mémoire qui mûrit (épopée #208, T26) : consolidation nocturne (`dream/`), ingestion
# de documents (`ingest`), entretien d'accueil (`onboarding`). Au-dessus de `penelope-app`
# et de `penelope-vault`, sous le daemon et l'orchestrateur, qui déclenchent le rêve.

[lints]
workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
tracing.workspace = true
chrono.workspace = true
# Jour du propriétaire dans son fuseau (nom de la séance d'accueil).
chrono-tz.workspace = true
# `Services`, helpers (`vault_dir`), inventaire machine.
penelope-app.workspace = true
# Écriture des notes et des entrées de mémoire (`vault_ops`).
penelope-vault.workspace = true
# Providers de modèles (`Context::provider_for`).
penelope-llm.workspace = true
# Configuration du propriétaire (fuseau).
penelope-kernel.workspace = true
# Niveaux et provenance des entrées de mémoire.
penelope-memory.workspace = true
