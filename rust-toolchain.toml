# Chaîne d'outils épinglée : la CI et le poste de travail utilisent exactement la même.
#
# Sans cet épinglage, une nouvelle version stable de clippy casse la CI sans qu'une
# ligne de code ait changé, et le lint local ne dit pas la même chose que le lint
# distant. `rustup` lit ce fichier automatiquement, donc rien à faire de plus.
#
# Pour monter de version : changer `channel`, relancer
# `cargo clippy --workspace --all-targets -- -D warnings`, corriger les nouveaux lints.

[toolchain]
channel = "1.98"
components = ["rustfmt", "clippy"]
targets = ["aarch64-apple-darwin", "x86_64-apple-darwin"]
profile = "minimal"
